<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Science Academy McKinley Park — Signage</title>
<style>
  :root{
    --bg: #0B0D16;
    --panel: #131627;
    --panel-line: #232A44;
    --ink: #F2F3F7;
    --ink-dim: #8A90AC;
    --navy: #2D3088;
    --navy-light: #4448B8;
    --orange: #F68626;
    --orange-dim: #6B3E13;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    width:100vw; height:100vh;
    overflow:hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #app{
    width:100vw; height:100vh;
    display:grid;
    grid-template-rows: 150px 1fr 84px;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 56px;
    background: linear-gradient(180deg, #10132390 0%, transparent 100%);
    border-bottom: 2px solid var(--orange);
  }

  .brand{
    display:flex;
    align-items:center;
    gap: 26px;
  }

  .brand img{
    height: 78px;
    width: auto;
    display:block;
    /* logo has a white background in the source file, this lifts it onto the dark header */
    filter: drop-shadow(0 0 0 rgba(0,0,0,0));
  }

  .brand .logo-wrap{
    background: #FFFFFF;
    padding: 10px 16px;
    border-radius: 8px;
    display:flex;
    align-items:center;
  }

  .brand .text-block{
    display:flex;
    flex-direction:column;
    gap: 4px;
    border-left: 1px solid var(--panel-line);
    padding-left: 26px;
  }

  .brand .school-name{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .brand .sub{
    color: var(--ink-dim);
    font-size: 17px;
    font-weight: 500;
  }

  /* ---------- WEATHER ---------- */
  .weather{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 0 28px;
    border-left: 1px solid var(--panel-line);
    border-right: 1px solid var(--panel-line);
  }

  .weather .icon{
    font-size: 42px;
    line-height: 1;
  }

  .weather .wx-text{
    display:flex;
    flex-direction:column;
    gap: 2px;
  }

  .weather .temp{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
  }

  .weather .place{
    color: var(--ink-dim);
    font-size: 15px;
  }

  .weather .cond{
    color: var(--ink-dim);
    font-size: 15px;
    text-transform: capitalize;
  }

  .clockblock{
    text-align: right;
  }

  .clockblock .time{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-size: 56px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
  }

  .clockblock .date{
    margin-top: 6px;
    color: var(--ink-dim);
    font-size: 18px;
  }

  /* ---------- MAIN STAGE ---------- */
  main{
    position:relative;
    display:flex;
    align-items:stretch;
    padding: 56px;
    gap: 48px;
    overflow:hidden;
  }

  .stage{
    flex: 1;
    position:relative;
  }

  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    opacity:0;
    transform: translateY(24px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events:none;
  }

  .slide.active{
    opacity:1;
    transform: translateY(0);
    pointer-events:auto;
  }

  .slide .kicker{
    display:inline-flex;
    align-self:flex-start;
    align-items:center;
    gap:10px;
    color: var(--orange);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .slide .kicker .dot{
    width:8px; height:8px;
    border-radius:50%;
    background: var(--orange);
  }

  .slide h2{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size: 80px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.08;
    max-width: 20ch;
    color: var(--ink);
  }

  .slide p{
    margin-top: 28px;
    font-size: 30px;
    color: var(--ink-dim);
    max-width: 46ch;
    line-height: 1.5;
  }

  /* side rail: schedule / quick facts */
  .rail{
    width: 420px;
    display:flex;
    flex-direction:column;
    gap: 16px;
  }

  .rail-card{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-left: 3px solid var(--navy-light);
    border-radius: 10px;
    padding: 22px 24px;
    display:flex;
    flex-direction:column;
    gap: 6px;
  }

  .rail-card .label{
    color: var(--ink-dim);
    font-size: 15px;
  }

  .rail-card .value{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size: 26px;
    font-weight: 700;
  }

  /* progress dots for slide position */
  .progress{
    position:absolute;
    bottom: 0;
    left:0;
    display:flex;
    gap: 10px;
  }

  .progress .seg{
    width: 46px;
    height: 4px;
    border-radius: 2px;
    background: var(--panel-line);
    overflow:hidden;
  }

  .progress .seg .fill{
    height:100%;
    width:0%;
    background: var(--orange);
  }

  /* ---------- TICKER ---------- */
  footer{
    border-top: 1px solid var(--panel-line);
    display:flex;
    align-items:center;
    overflow:hidden;
    background: var(--navy);
  }

  .ticker-label{
    flex-shrink:0;
    background: var(--orange);
    color: #241300;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.02em;
    padding: 0 26px;
    height:100%;
    display:flex;
    align-items:center;
  }

  .ticker-track{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    height:100%;
    display:flex;
    align-items:center;
  }

  .ticker-track .ticker-inner{
    display:inline-flex;
    align-items:center;
    padding-left: 100%;
    animation: scroll-left 32s linear infinite;
  }

  .ticker-track .ticker-inner span{
    font-size: 30px;
    color: var(--ink);
    margin-right: 80px;
  }

  @keyframes scroll-left{
    from{ transform: translateX(0); }
    to{ transform: translateX(-100%); }
  }

  @media (prefers-reduced-motion: reduce){
    .ticker-inner{ animation: none; }
    .slide{ transition: none; }
  }
</style>
</head>

      <div class="text-block">
        <span class="school-name" id="schoolName">HSA McKinley Park HS</span>
        <span class="sub" id="orgSub">Announcements</span>
      </div>
    </div>
    <div class="weather" id="weather">
      <div class="icon" id="wxIcon">⛅</div>
      <div class="wx-text">
        <div class="temp" id="wxTemp">--°</div>

      <!-- rail cards injected here -->

  <footer>

<script>
/* =========================================================
   EDIT EVERYTHING YOU NEED HERE. Nothing below this block
   needs to change for day-to-day updates.
   ========================================================= */
const CONFIG = {
  schoolName: "HSA McKinley Park High School",
  orgSub: "Daily Announcements",

  // Each slide fills the main stage. Shown one at a time, in order, then loops.
  slides: [
    {
      kicker: "Welcome",
      title: "Go Hawks.",
      body: "This screen rotates through daily announcements, schedule changes, and upcoming events. Updates happen automatically."
    },
    {
      kicker: "Reminder",
      title: "Parent Teacher Conferences September 21st.",
      body: "10:00 AM till 6:00 PM.Dont forget to schedule."
    },
    {
      kicker: "Heads up",
      title: "Picture Day is Coming Soon.",
      body: "Picture Day Date(s): October 15, 2026."
    },
     {
      kicker: "Robotics Corner",
      title: "FRC Robotics going to St.Luis.",
      body: "Students going to to the Gateway Robotics competition in St. Louis on Friday, September 11, and Saturday, September 12:."
    }
  ],

  // Small cards on the right rail, stay visible at all times.
  railCards: [
    { label: "Today's Lunch", value: "WG Chili Mac" },
    { label: "Bell Schedule", value: "Regular day" },
    { label: "Next Event", value: "ACT Test — Next Tuesday" }
  ],

  // Scrolling ticker text at the bottom.
  tickerItems: [
    "Live the SOAR Way!!!",
    " Our Culture. Our Commitment.  ",
    "It Starts With You:",
    "Set Goals • Offer Kindness • Act Responsibly • Rise with Integrity ."
  ],

  secondsPerSlide: 10
};
/* ========================================================= */

document.getElementById('orgSub').textContent = CONFIG.orgSub;
document.getElementById('schoolName').textContent = CONFIG.schoolName;

// ---- Weather (Chicago, via Open-Meteo — no API key required) ----
const WMO_ICONS = {
  0: ['☀️','Clear sky'], 1: ['🌤️','Mostly clear'], 2: ['⛅','Partly cloudy'], 3: ['☁️','Overcast'],
  45: ['🌫️','Fog'], 48: ['🌫️','Fog'],
  51: ['🌦️','Light drizzle'], 53: ['🌦️','Drizzle'], 55: ['🌦️','Heavy drizzle'],
  61: ['🌧️','Light rain'], 63: ['🌧️','Rain'], 65: ['🌧️','Heavy rain'],
  66: ['🌧️','Freezing rain'], 67: ['🌧️','Freezing rain'],
  71: ['🌨️','Light snow'], 73: ['🌨️','Snow'], 75: ['❄️','Heavy snow'], 77: ['🌨️','Snow grains'],
  80: ['🌦️','Rain showers'], 81: ['🌧️','Rain showers'], 82: ['⛈️','Violent showers'],
  85: ['🌨️','Snow showers'], 86: ['🌨️','Snow showers'],
  95: ['⛈️','Thunderstorm'], 96: ['⛈️','Thunderstorm'], 99: ['⛈️','Severe storm']
};

async function updateWeather(){
  try{
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.85&longitude=-87.65&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago', { signal: controller.signal });
    clearTimeout(timeout);
    if(!res.ok) throw new Error('Bad response: ' + res.status);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    const [icon, label] = WMO_ICONS[code] || ['🌡️', 'Chicago'];
    document.getElementById('wxTemp').textContent = `${temp}°F`;
    document.getElementById('wxIcon').textContent = icon;
    document.getElementById('wxCond').textContent = label;
  }catch(e){
    console.error('Weather fetch failed:', e);
    document.getElementById('wxCond').textContent = 'Unavailable';
    document.getElementById('wxTemp').textContent = '--°';
  }
}
updateWeather();
setInterval(updateWeather, 15 * 60 * 1000);

// ---- Clock ----
function pad(n){ return n.toString().padStart(2,'0'); }
function tickClock(){
  const now = new Date();
  let h = now.getHours();
  const m = pad(now.getMinutes());
  document.getElementById('clockTime').textContent = `${pad(h)}:${m}`;
  document.getElementById('clockDate').textContent = now.toLocaleDateString(undefined, {
    weekday: 'long', month: 'long', day: 'numeric'
  });
}
tickClock();
setInterval(tickClock, 1000);

// ---- Rail cards ----
const rail = document.getElementById('rail');
CONFIG.railCards.forEach(card => {
  const el = document.createElement('div');
  el.className = 'rail-card';
  el.innerHTML = `<div class="label">${card.label}</div><div class="value">${card.value}</div>`;
  rail.appendChild(el);
});

// ---- Ticker ----
const tickerInner = document.getElementById('tickerInner');
CONFIG.tickerItems.forEach(item => {
  const span = document.createElement('span');
  span.textContent = item;
  tickerInner.appendChild(span);
});

// ---- Slides ----
const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
let slideEls = [];
let segFills = [];
let current = 0;

CONFIG.slides.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (i === 0 ? ' active' : '');
  el.innerHTML = `
    <div class="kicker"><span class="dot"></span>${s.kicker}</div>
    <h2>${s.title}</h2>
    <p>${s.body}</p>
  `;
  stage.insertBefore(el, progress);
  slideEls.push(el);

  const seg = document.createElement('div');
  seg.className = 'seg';
  const fill = document.createElement('div');
  fill.className = 'fill';
  seg.appendChild(fill);
  progress.appendChild(seg);
  segFills.push(fill);
});

function goToSlide(i){
  slideEls[current].classList.remove('active');
  segFills[current].style.transition = 'none';
  segFills[current].style.width = '0%';
  current = i;
  slideEls[current].classList.add('active');
  requestAnimationFrame(() => {
    segFills[current].style.transition = `width ${CONFIG.secondsPerSlide}s linear`;
    segFills[current].style.width = '100%';
  });
}

function startRotation(){
  goToSlide(0);
  setInterval(() => {
    const next = (current + 1) % slideEls.length;
    goToSlide(next);
  }, CONFIG.secondsPerSlide * 1000);
}

if (slideEls.length > 0) startRotation();
</script>
